<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Sign in | Sheet Metal Workflow</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f3f5f8; color: #17212f; font-family: Arial, sans-serif; }
    .card { width: 100%; max-width: 410px; padding: 36px; background: #fff; border: 1px solid #e2e7ee; border-radius: 14px; box-shadow: 0 14px 40px rgba(20,35,55,.08); }
    .brand { width: 42px; height: 42px; display: grid; place-items: center; margin-bottom: 24px; border-radius: 10px; background: #172b4d; color: white; font-weight: 700; }
    h1 { margin: 0 0 8px; font-size: 24px; }
    p { margin: 0 0 26px; color: #647184; line-height: 1.5; font-size: 14px; }
    label { display: block; margin: 16px 0 7px; font-size: 13px; font-weight: 700; }
    input { width: 100%; padding: 12px 13px; border: 1px solid #ccd4df; border-radius: 7px; font-size: 15px; }
    input:focus { outline: 2px solid #9db8df; border-color: #5379aa; }
    button { width: 100%; margin-top: 22px; padding: 13px; border: 0; border-radius: 7px; background: #18365f; color: white; font-size: 15px; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    #message { min-height: 20px; margin: 14px 0 0; color: #b42318; font-size: 13px; }
    .foot { margin-top: 22px; color: #8792a2; font-size: 12px; text-align: center; }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">SM</div>
    <h1>Welcome back</h1>
    <p>Sign in to access the Sheet Metal Workflow workspace.</p>
    <form id="loginForm">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" required autofocus>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button id="submitButton" type="submit">Sign in</button>
      <div id="message" role="alert"></div>
    </form>
    <div class="foot">Private workspace · Authorized access only</div>
  </main>
  <script>
    const form = document.getElementById("loginForm");
    const button = document.getElementById("submitButton");
    const message = document.getElementById("message");
    form.addEventListener("submit", async event => {
      event.preventDefault();
      button.disabled = true;
      message.textContent = "";
      try {
        const response = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            username: document.getElementById("username").value,
            password: document.getElementById("password").value
          })
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || "Sign-in failed.");
        window.location.replace("/");
      } catch (error) {
        message.textContent = error.message;
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
